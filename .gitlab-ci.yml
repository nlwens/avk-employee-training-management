stages:
  - install
  - lint
  - build
  - test

variables:
  GIT_DEPTH: 1
  JWT_SECRET: test-jwt-secret-for-e2e-testing-only
  VITE_API_URL: http://127.0.0.1:3000
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: test_password_please_change_this_123!

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_TAG

default:
  image: node:latest
  cache:
    key:
      prefix: v3
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
      - apps/**/node_modules
      - packages/**/node_modules

npm-install:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline

# running a linter at the same time in all applications.
lint-all:
  stage: lint
  needs: [npm-install]
  script:
    - npm run lint

# building all applications at the same time.
build-all:
  stage: build
  needs: [npm-install]
  script:
    - npm run build
  artifacts:
    name: "$CI_COMMIT_REF_NAME-apps"
    paths:
      - apps/*/dist
      - .turbo/
    expire_in: 7 days

test-unit:
  stage: test
  needs: [build-all]
  script:
    - npm run test

test-e2e-server:
  stage: test
  needs: [build-all]
  script:
    - cd apps/server
    - npm run test:e2e:ci
  artifacts:
    paths:
      - apps/server/test/coverage-e2e
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/server/test/coverage-e2e/cobertura-coverage.xml
    expire_in: 30 days
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

test-component-clients:
  stage: test
  needs: [build-all]
  script:
    - npm run test:component

.e2e-clients-base:
  stage: test
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  needs: [build-all]
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: avk
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  before_script:
    - |
      cat > apps/server/.env <<EOF
      DATABASE_HOST=postgres
      DATABASE_PORT=5432
      DATABASE=avk
      DATABASE_USERNAME=postgres
      DATABASE_PASSWORD=password
      SERVER_PORT=3000
      JWT_SECRET=${JWT_SECRET}
      ADMIN_EMAIL=${ADMIN_EMAIL}
      ADMIN_PASSWORD=${ADMIN_PASSWORD}
      EOF
    - npx playwright --version
    - ls -la /ms-playwright

test-e2e-client-app:
  extends: .e2e-clients-base
  script:
    - |
      cat > apps/client-app/.env <<EOF
      VITE_API_URL=${VITE_API_URL}
      ADMIN_EMAIL=${ADMIN_EMAIL}
      ADMIN_PASSWORD=${ADMIN_PASSWORD}
      EOF
    - npm run test:e2e:ci:app
  artifacts:
    when: on_failure
    paths:
      - apps/client-app/test-results/*
    expire_in: 1 day

test-e2e-client-dashboard:
  extends: .e2e-clients-base
  script:
    - |
      cat > apps/client-dashboard/.env <<EOF
      VITE_API_URL=${VITE_API_URL}
      ADMIN_EMAIL=${ADMIN_EMAIL}
      ADMIN_PASSWORD=${ADMIN_PASSWORD}
      EOF
    - npm run test:e2e:ci:dashboard
  artifacts:
    when: on_failure
    paths:
      - apps/client-dashboard/test-results/*
    expire_in: 1 day
